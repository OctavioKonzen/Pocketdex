name: pocket_dex
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # DEPENDÊNCIAS DE PRODUÇÃO
  # Certifique-se que cada uma aparece só uma vez!
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  debounce_throttle: ^2.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  package_info_plus: ^10.2.1
  ota_update: ^7.1.0
  http: ^1.6.0
  
  # Adicione suas outras dependências aqui...

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # DEPENDÊNCIAS DE DESENVOLVIMENTO
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/database/
    - assets/database/sprites/pokemon/
    - assets/database/sprites/pokemon/shiny/
    - assets/database/sprites/pokemon/other/official-artwork/
    - assets/database/sprites/pokemon/other/official-artwork/shiny/
    - assets/database/sprites/items/
