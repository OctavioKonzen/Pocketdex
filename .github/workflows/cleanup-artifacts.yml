name: Limpeza dos arquivos dos workflows

# Todo dia apaga os arquivos gerados pelos workflows (prints de teste,
# relatórios, pacotes antigos do site) com mais de um dia. Fica só o pacote
# mais recente do site. Nada disso é usado pelo app nem pelo site no ar.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar arquivos antigos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=github-pages" --jq '[.artifacts[]] | max_by(.created_at) | .id // empty')
          limit=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$limit\") | .id" | sort -u > ids.txt
          n=0
          while read -r id; do
            [ "$id" = "$keep" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && n=$((n+1)) || true
          done < ids.txt
          echo "Apagados: $n"
