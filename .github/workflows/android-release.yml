name: App Android (APK)

# Gera o APK do app e publica em GitHub Releases sempre que a versão do
# pubspec.yaml muda (ex.: 1.1.0+2 → 1.2.0+3). O app confere essa página ao
# abrir e oferece a atualização; o site tem o botão de download.
#
# Precisa destes secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   chave de assinatura (.jks) em base64
#   ANDROID_KEYSTORE_PASSWORD senha da chave
#   ANDROID_KEY_ALIAS         apelido da chave
#   ANDROID_KEY_PASSWORD      senha do apelido
#   GOOGLE_SERVICES_JSON      conteúdo do google-services.json (Firebase)
# Sem eles o APK é gerado só como teste (confere que o app compila) e não é
# publicado.

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - android/**
      - .github/workflows/android-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão e secrets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "A versão v$VERSION já está publicada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$KEYSTORE" ] && [ -n "$GOOGLE_SERVICES" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Faltam os secrets da chave de assinatura ou do google-services.json: o APK é gerado só como teste e não é publicado."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.skip == 'false'
        with:
          channel: stable
          cache: true

      - name: Gerar APK assinado
        if: steps.check.outputs.skip == 'false'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/pocketdex.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pocketdex.jks"
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json
          fi
          flutter pub get
          flutter test
          # Artes menores só no APK (o site continua com as grandes).
          pip install pillow
          python3 tool/shrink_app_images.py
          # Só celulares ARM (praticamente todos): APK menor.
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk PocketDex.apk

      - name: Publicar versão
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # O nome fixo PocketDex.apk deixa o link
          # releases/latest/download/PocketDex.apk sempre apontando para a última.
          gh release create "v$VERSION" PocketDex.apk \
            --title "PocketDex $VERSION" \
            --notes "$(git log -1 --pretty=%B)"
